<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaviah Essentials - Pure Castor Oil</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #656b38;
            overflow-x: hidden;
        }

        /* Hero Section */
        #hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            font-weight: bold;
            color: #878f3b;
            position: relative;
            background-color: #f5f5f5;
        }

        .leaf {
            position: absolute;
            width: 100px;
            opacity: 0.7;
        }

        .leaf1 { top: 20%; left: 10%; transform: rotate(15deg); }
        .leaf2 { top: 40%; right: 15%; transform: rotate(-20deg); }
        .leaf3 { bottom: 25%; left: 30%; transform: rotate(5deg); }

        /* Falling Seeds */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            opacity: 0; /* Hidden until triggered */
            z-index: 1;
        }

        .seed {
            position: absolute;
            width: 10px;
            height: 10px;
            background: url('seed.png') no-repeat center/cover; /* Or brown circle: background-color: #8B4513; border-radius: 50%; */
            animation: fall 10s linear infinite;
            opacity: 0.6;
        }

        @keyframes fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        /* Branch */
        #branch {
            position: fixed;
            top: 0;
            left: -100px; /* Starts off-screen */
            width: 200px;
            opacity: 0;
            z-index: 2;
        }

        /* Swipe Overlay */
        #swipe-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #878f3b; /* Your color */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            color: #ffffff;
            z-index: 3;
            overflow: hidden;
        }

        .swipe-leaf {
            position: absolute;
            width: 150px;
            height: auto;
        }

        .swipe-leaf1 { top: 10%; left: 20%; transform: rotate(10deg); }
        .swipe-leaf2 { bottom: 15%; right: 25%; transform: rotate(-15deg); }

        /* Bottle Section */
        #bottle-section {
            height: 200vh; /* Extra height for scrolling animations */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        #bottle {
            width: 200px;
            height: 400px;
            position: relative;
            background: url('bottle-outline.png') no-repeat center/cover;
            overflow: hidden;
        }

        #liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%; /* Starts empty */
            background: url('oil-texture.png') repeat; /* Golden oil color: background-color: #DAA520; */
            transition: height 0.5s; /* For smoothness, but animated via GSAP */
        }

        .use {
            position: absolute;
            background-color: #656b38;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1rem;
            opacity: 0;
            transform: scale(0);
            text-align: center;
        }

        /* Media Query for Mobile */
        @media (max-width: 768px) {
            #hero { font-size: 3rem; }
            #swipe-overlay { font-size: 3rem; }
            .animations { animation-duration: 1s !important; } /* Tone down */
        }
    </style>
</head>
<body>
    <!-- Hero -->
    <section id="hero">
        Reaviah Essentials
        <img class="leaf leaf1" src="leaf.png" alt="Castor Leaf">
        <img class="leaf leaf2" src="leaf.png" alt="Castor Leaf">
        <img class="leaf leaf3" src="leaf.png" alt="Castor Leaf">
    </section>

    <!-- Particles (Seeds) -->
    <div id="particles"></div>

    <!-- Branch -->
    <img id="branch" src="branch.png" alt="Castor Branch">

    <!-- Swipe Overlay (over hero, but positioned absolutely) -->
    <div id="swipe-overlay">
        Reaviah Essentials
        <img class="swipe-leaf swipe-leaf1" src="leaf.png" alt="Swipe Leaf">
        <img class="swipe-leaf swipe-leaf2" src="leaf.png" alt="Swipe Leaf">
    </div>

    <!-- Bottle Section -->
    <section id="bottle-section">
        <div id="bottle">
            <div id="liquid"></div>
        </div>
        <!-- Uses (positioned via JS) -->
        <div class="use">Hair Growth</div>
        <div class="use">Skin Care</div>
        <div class="use">Wellness</div>
        <div class="use">Moisturizing</div>
        <div class="use">Anti-Inflammatory</div>
    </section>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Create falling seeds dynamically
        const particles = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const seed = document.createElement('div');
            seed.classList.add('seed');
            seed.style.left = `${Math.random() * 100}vw`;
            seed.style.animationDelay = `${Math.random() * 10}s`;
            seed.style.animationDuration = `${5 + Math.random() * 10}s`;
            particles.appendChild(seed);
        }

        // Scroll Triggers
        ScrollTrigger.create({
            trigger: "#hero",
            start: "top top",
            end: "bottom top",
            scrub: true,
            onEnter: () => {
                // Seeds falling and branch appear on scroll start
                gsap.to("#particles", { opacity: 1, duration: 1 });
                gsap.to("#branch", { left: 0, opacity: 1, duration: 1 });
            }
        });

        // Swipe reveal
        gsap.to("#swipe-overlay", {
            scrollTrigger: {
                trigger: "#bottle-section",
                start: "top bottom",
                end: "top top",
                scrub: true
            },
            x: "100vw", // Swipe to right
            ease: "power2.inOut"
        });

        // Oil pour (fill bottle)
        gsap.to("#liquid", {
            scrollTrigger: {
                trigger: "#bottle-section",
                start: "top center",
                end: "center center",
                scrub: true
            },
            height: "100%",
            ease: "linear"
        });

        // Circular uses pop up
        const uses = document.querySelectorAll('.use');
        const bottle = document.getElementById('bottle');
        const radius = 150; // Circle radius
        uses.forEach((use, i) => {
            const angle = (i / uses.length) * 360;
            const x = radius * Math.cos(angle * Math.PI / 180);
            const y = radius * Math.sin(angle * Math.PI / 180);
            use.style.left = `calc(50% + ${x}px)`;
            use.style.top = `calc(50% + ${y}px)`;
            gsap.to(use, {
                scrollTrigger: {
                    trigger: "#bottle-section",
                    start: "center center",
                    end: "bottom center",
                    scrub: true
                },
                opacity: 1,
                scale: 1,
                delay: i * 0.2,
                ease: "bounce.out"
            });
        });
    </script>
</body>
</html>
